<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    
       <!-- Section 1: Basic Grid Container -->
    <div class="section">
        <h2>1. Basic Grid Container</h2>
        <p class="description">Adding <code>display: grid</code> to a container makes it a grid container. Children
            become grid items.</p>

        <div class="example-container">
            <span class="code-label">display: grid; grid-template-columns: 1fr 1fr 1fr;</span>
            <div class="grid-container grid-basic">
                <div class="grid-item">1</div>
                <div class="grid-item">2</div>
                <div class="grid-item">3</div>
                <div class="grid-item">4</div>
                <div class="grid-item">5</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
                <div class="grid-item">6</div>
            </div>
        </div>
    </div>

</body>
</html>
